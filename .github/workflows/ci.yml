name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    # VoxScripta targets macOS 26 and depends on SpeechAnalyzer and the Foundation
    # Models framework, so the runner image has to be macOS 26 or newer.
    runs-on: macos-26
    # The macOS arm64 queue is capacity-constrained and a job that is never
    # acquired sits for fifteen minutes before failing. Fail in five instead:
    # the run is red either way, and ten minutes of nothing teaches nobody.
    timeout-minutes: 45
    steps:
      # submodules matters as much as lfs: Sources/CGGML/include/ggml.h
      # includes straight into vendor/llama.cpp, so without them the build
      # fails at the first header with "file not found". CI never checked
      # them out, which is one reason this job could not have passed even
      # once it got past the Xcode step.
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      # Chosen rather than hardcoded. This step used to name
      # /Applications/Xcode_26.app, which the image does not have, so every
      # run failed here in twelve seconds — on every commit, for weeks,
      # while people pushed past the red.
      - name: Select Xcode
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$newest" ] || { echo "::error::No Xcode on this image"; exit 1; }
          echo "Selecting $newest"
          sudo xcode-select -s "$newest"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # whisper.cpp, llama.cpp and FFmpeg are built from source and linked in,
      # so the products cannot link without them. Building them on every run
      # would dominate the job, and they only change when a submodule moves —
      # so the key is the submodule state itself.
      - name: Cache the native engines
        id: engines
        uses: actions/cache@v4
        with:
          path: |
            build/engines
            build/ffmpeg
          key: engines-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ hashFiles('.git/modules/**/HEAD') }}

      - name: Build the native engines
        if: steps.engines.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          Tools/build-engines.sh
          Tools/build-ffmpeg.sh

      # Warnings are errors in CI, which is what makes the Swift 6 strict
      # concurrency guarantee mean something. A data race that the compiler can
      # see must never reach main.
      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      # Both of these are scripts the repository already has, and neither was
      # ever run on a push. The localization gate had been failing locally for
      # three weeks while CI reported nothing, because CI never asked it.
      - name: Translations complete
        run: Tools/check-localization.sh

      # The header is hand-written, so nothing stops it drifting from the
      # symbols the library exports. Dart reads the header.
      - name: Header matches the library
        run: Tools/check-abi.sh

      # The gate that watches the gates. check-localization.sh existed, worked
      # and was wired to nothing for three weeks; this fails if that happens
      # again to any of them.
      - name: Conventions
        run: Tools/check-conventions.sh

      # The privacy claim in §26 is structural, so it gets checked mechanically
      # rather than trusted. No source file may import a networking API.
      - name: Assert no networking imports
        run: |
          if grep -rnE '^\s*import\s+(Network|CFNetwork)\b' Sources/; then
            echo "::error::A networking framework was imported. VoxScripta ships without the network entitlement."
            exit 1
          fi
          if grep -rnE '\b(URLSession|NWConnection|CFSocket)\b' Sources/; then
            echo "::error::A networking API was referenced. VoxScripta ships without the network entitlement."
            exit 1
          fi
          echo "No networking APIs referenced."

  # Deliberately not macOS: these need no Apple toolchain, and the macOS queue
  # is the scarce resource. flutter/app's preview comparison loads fonts from
  # /System/Library/Fonts and skips itself when they are absent, which is what
  # lets it run here at all.
  dart:
    name: Dart tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Without this the analyzer cannot see any package and reports 507
      # undefined names. flutter-action installs the SDK; it does not resolve
      # a project's dependencies, and `flutter test` does its own pub get
      # while `dart analyze` does not — so the first run failed here and
      # passed locally, where .dart_tool already existed.
      - name: Resolve dependencies
        run: |
          set -euo pipefail
          for dir in flutter/voxscripta_engine flutter/app; do
            (cd "$dir" && flutter pub get)
          done

      - name: Analyze
        working-directory: flutter/voxscripta_engine
        run: dart analyze

      - name: Test
        working-directory: flutter/voxscripta_engine
        run: flutter test

      - name: Analyze the app
        working-directory: flutter/app
        run: flutter analyze

      - name: Test the app
        working-directory: flutter/app
        run: flutter test
